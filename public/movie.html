<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhes do Filme — Cinefolio</title>
  <meta name="description" content="Veja detalhes, classifique e adicione filmes ao seu perfil pessoal no Cinefolio.">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos Customizados -->
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <!-- Barra de Navegação -->
  <header>
    <nav class="navbar navbar-expand-lg site-navbar">
      <div class="container-fluid px-lg-4">
        <a class="navbar-brand" href="index.html">
          <span>🎬</span> Cinefolio
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#movieNavbar" aria-controls="movieNavbar" aria-expanded="false" aria-label="Alternar navegação">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="movieNavbar">
          <div id="nav-auth-container" class="ms-auto">
            <ul class="navbar-nav align-items-center gap-2">
              <li class="nav-item">
                <a class="nav-link auth-link" href="login.html">Entrar</a>
              </li>
              <li class="nav-item" id="nav-register-link">
                <a class="btn btn-sm btn-nav-primary" href="register.html">Criar Conta</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- Conteúdo Principal -->
  <div class="main-wrapper">
    <main class="page-container">
      <!-- Container com Detalhes do Filme da TMDB -->
      <section id="movie-detail" aria-label="Informações do Filme">
        <div class="loading-spinner-wrap">
          <div class="spinner-custom"></div>
          <p class="mb-0">Carregando detalhes do filme...</p>
        </div>
      </section>

      <!-- Painel de Classificação e Salvamento no Perfil -->
      <section class="d-flex justify-content-center mt-4">
        <div class="panel-card panel-card-wide">
          <h2 class="panel-title fs-4">💾 Adicionar ou Atualizar no Meu Perfil</h2>
          <p class="panel-subtitle">Defina o status, sua avaliação e anote suas impressões sobre o filme.</p>

          <form id="movie-form" novalidate>
            <div class="row g-3">
              <!-- Status do Filme -->
              <div class="col-md-6">
                <label for="select-status" class="form-label">Status</label>
                <select id="select-status" name="status" class="form-select" required>
                  <option value="WATCHING">▶️ Assistindo</option>
                  <option value="WATCHED" selected>✅ Assistido</option>
                  <option value="PLAN_TO_WATCH">📌 Pretendo Assistir</option>
                  <option value="DROPPED">⏹️ Abandonado</option>
                </select>
              </div>

              <!-- Nota / Avaliação (0 a 10) -->
              <div class="col-md-6">
                <label for="input-rating" class="form-label">Nota Pessoal (0 a 10)</label>
                <input
                  type="number"
                  id="input-rating"
                  name="rating"
                  class="form-control"
                  placeholder="ex: 8.5"
                  min="0"
                  max="10"
                  step="0.5"
                >
              </div>

              <!-- Data em que assistiu -->
              <div class="col-md-6">
                <label for="input-watched-at" class="form-label">Data em que assistiu</label>
                <input
                  type="date"
                  id="input-watched-at"
                  name="watched_at"
                  class="form-control"
                >
              </div>

              <!-- Checkbox Favorito -->
              <div class="col-md-6 d-flex align-items-end">
                <div class="form-check pb-2">
                  <input class="form-check-input" type="checkbox" id="check-favorite" name="favorite">
                  <label class="form-check-label" for="check-favorite">
                    ❤️ Marcar como Favorito
                  </label>
                </div>
              </div>

              <!-- Campo de Review / Crítica -->
              <div class="col-12">
                <label for="textarea-review" class="form-label">Minha Crítica / Review</label>
                <textarea
                  id="textarea-review"
                  name="review"
                  class="form-control"
                  rows="4"
                  maxlength="5000"
                  placeholder="Escreva suas impressões, análise e opiniões sobre este filme..."
                ></textarea>
                <div class="form-text text-muted small text-end">Máximo de 5000 caracteres.</div>
              </div>
            </div>

            <div id="movie-message" class="alert d-none mt-3" role="alert"></div>

            <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mt-4 pt-2 border-top border-secondary-subtle">
              <button type="submit" class="btn btn-accent">
                💾 Salvar no Perfil
              </button>
              <button id="btn-remove-movie" type="button" class="btn btn-danger-custom d-none">
                🗑️ Remover do Perfil
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- Rodapé -->
  <footer class="site-footer">
    <div class="container text-center">
      <p class="mb-1"><strong>Cinefolio</strong> — Seu Perfil de Cinema</p>
      <p class="mb-0 text-muted">Dados de catálogo providos por TMDB.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/movie.js"></script>
</body>
</html>
