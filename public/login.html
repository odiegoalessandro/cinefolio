<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Cinefolio</title>
  <meta name="description" content="Acesse sua conta no Cinefolio e gerencie seus filmes catalogados.">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos Customizados -->
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <!-- Barra de Navegação -->
  <header>
    <nav class="navbar site-navbar">
      <div class="container-fluid px-lg-4">
        <a class="navbar-brand" href="index.html">
          <span>🎬</span> Cinefolio
        </a>
        <div>
          <a class="nav-link text-muted" href="index.html">← Voltar ao Início</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- Conteúdo Principal -->
  <div class="main-wrapper">
    <main class="form-center-page">
      <div class="panel-card">
        <h1 class="panel-title">Entrar</h1>
        <p class="panel-subtitle">Bem-vindo(a) de volta! Acesse sua coleção de cinema.</p>

        <!-- "novalidate" desliga a validação NATIVA do navegador, porque
             o JS (auth.js) já cuida da submissão via fetch e mostra os
             erros de forma customizada; os atributos "required" continuam
             dando uma dica visual (asterisco/contorno), mas quem decide o
             fluxo de fato é o script -->
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="input-username" class="form-label">Nome de Usuário (Username)</label>
            <input
              type="text"
              id="input-username"
              name="username"
              class="form-control"
              placeholder="ex: diego"
              required
              autocomplete="username"
              autofocus
            >
          </div>

          <div class="mb-3">
            <label for="input-password" class="form-label">Senha</label>
            <input
              type="password"
              id="input-password"
              name="password"
              class="form-control"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            >
          </div>

          <!-- Área onde auth.js injeta mensagens de erro/sucesso (ver
               função showMessage em auth.js); começa escondida (d-none) -->
          <div class="form-message alert d-none" role="alert"></div>

          <button type="submit" class="btn btn-accent w-100 mt-2">
            Entrar na Conta
          </button>

          <p class="text-center text-muted mt-3 mb-0 small">
            Ainda não possui cadastro?
            <a href="register.html" class="text-white fw-bold">Criar conta</a>
          </p>
        </form>
      </div>
    </main>
  </div>

  <!-- Scripts: carregados no FINAL do body, para não bloquear a
       renderização inicial da página enquanto baixam -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- file-protocol-guard roda ANTES de tudo (sem type="module") para
       avisar se a página foi aberta com duplo clique em vez de via servidor -->
  <script src="js/file-protocol-guard.js"></script>
  <!-- type="module" habilita import/export do ES Modules dentro de auth.js -->
  <script type="module" src="js/auth.js"></script>
</body>
</html>
