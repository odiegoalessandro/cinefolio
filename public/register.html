<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar Conta — Cinefolio</title>
  <meta name="description" content="Cadastre-se no Cinefolio para criar sua coleção e compartilhar seu perfil cinematográfico.">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos Customizados -->
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <!-- Barra de Navegação -->
  <header>
    <nav class="navbar site-navbar">
      <div class="container-fluid px-lg-4">
        <a class="navbar-brand" href="index.html">
          <span>🎬</span> Cinefolio
        </a>
        <div>
          <a class="nav-link text-muted" href="index.html">← Voltar ao Início</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- Conteúdo Principal -->
  <div class="main-wrapper">
    <main class="form-center-page">
      <div class="panel-card">
        <h1 class="panel-title">Criar Conta</h1>
        <p class="panel-subtitle">Monte seu portfólio de filmes e avalie suas obras favoritas.</p>

        <form id="register-form" novalidate>
          <div class="mb-3">
            <label for="reg-username" class="form-label">Nome de Usuário (Username)</label>
            <input
              type="text"
              id="reg-username"
              name="username"
              class="form-control"
              placeholder="ex: diego (sem espaços)"
              minlength="3"
              maxlength="30"
              required
              autocomplete="username"
              autofocus
            >
            <div class="form-text text-muted small">Usado na URL do seu perfil público (3 a 30 caracteres).</div>
          </div>

          <div class="mb-3">
            <label for="reg-display-name" class="form-label">Nome de Exibição</label>
            <input
              type="text"
              id="reg-display-name"
              name="display_name"
              class="form-control"
              placeholder="ex: Diego Alessandro"
              maxlength="80"
              required
              autocomplete="name"
            >
          </div>

          <div class="mb-3">
            <label for="reg-password" class="form-label">Senha</label>
            <input
              type="password"
              id="reg-password"
              name="password"
              class="form-control"
              placeholder="Mínimo de 8 caracteres"
              minlength="8"
              required
              autocomplete="new-password"
            >
          </div>

          <div class="form-message alert d-none" role="alert"></div>

          <button type="submit" class="btn btn-accent w-100 mt-2">
            Criar Minha Conta
          </button>

          <p class="text-center text-muted mt-3 mb-0 small">
            Já possui uma conta?
            <a href="login.html" class="text-white fw-bold">Faça login</a>
          </p>
        </form>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
