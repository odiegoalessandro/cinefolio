<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil de Cinema — Cinefolio</title>
  <meta name="description" content="Confira os filmes assistidos, favoritos e reviews deste perfil no Cinefolio.">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos Customizados -->
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <!-- Barra de Navegação -->
  <header>
    <nav class="navbar navbar-expand-lg site-navbar">
      <div class="container-fluid px-lg-4">
        <a class="navbar-brand" href="index.html">
          <span>🎬</span> Cinefolio
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#profileNavbar" aria-controls="profileNavbar" aria-expanded="false" aria-label="Alternar navegação">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="profileNavbar">
          <div id="nav-auth-container" class="ms-auto">
            <ul class="navbar-nav align-items-center gap-2">
              <li class="nav-item">
                <a class="nav-link auth-link" href="login.html">Entrar</a>
              </li>
              <li class="nav-item" id="nav-register-link">
                <a class="btn btn-sm btn-nav-primary" href="register.html">Criar Conta</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- Conteúdo Principal do Perfil -->
  <div class="main-wrapper">
    <main class="page-container">
      <div id="profile">
        <div class="loading-spinner-wrap">
          <div class="spinner-custom"></div>
          <p class="mb-0">Carregando perfil público...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Diálogo Modal Acessível para Exibição de Reviews -->
  <dialog id="review-dialog" class="custom-dialog" aria-labelledby="review-title">
    <div class="dialog-header">
      <div>
        <h2 id="review-title" class="dialog-title">Review do Filme</h2>
        <div id="review-rating" class="text-warning small mt-1 fw-bold"></div>
      </div>
      <button class="dialog-close-btn" type="button" aria-label="Fechar review">×</button>
    </div>
    <div id="review-content" class="dialog-body"></div>
    <div class="text-end mt-3 pt-2 border-top border-secondary-subtle">
      <button class="btn btn-sm btn-outline-light dialog-close-btn" type="button">Fechar</button>
    </div>
  </dialog>

  <!-- Rodapé -->
  <footer class="site-footer">
    <div class="container text-center">
      <p class="mb-1"><strong>Cinefolio</strong> — Seu Perfil de Cinema</p>
      <p class="mb-0 text-muted">Desenvolvido em conformidade com as diretrizes acadêmicas de Banco de Dados.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/file-protocol-guard.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
